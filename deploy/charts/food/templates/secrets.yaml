{{- if .Values.secrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: food-google
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.clusterLocation | default "asia-south1-a" | quote }}
          clusterName: {{ .Values.clusterName | default "food-gke" | quote }}
          serviceAccountRef: {name: food-eso}
---
{{- range $kind,$keys := dict "db" (dict "DB_PASSWORD" "") "kafka" (dict "KAFKA_API_KEY" "api_key" "KAFKA_API_SECRET" "api_secret") "web" (dict "WEB_OPERATOR_USER" "username" "WEB_OPERATOR_PASSWORD_HASH" "password_hash") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: food-{{ $kind }}
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: food-google, kind: SecretStore}
  target: {name: food-{{ $kind }}, creationPolicy: Owner}
  data:
    {{- range $key,$property := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $.Values.secrets $kind | quote }}
        version: {{ index $.Values.secrets.versions $kind | quote }}
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
