{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: food-private-boundary}
spec:
  podSelector: {matchLabels: {part-of: food}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {part-of: food}}}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 443}, {port: 9092}, {port: 3307}, {port: 80}, {port: 988}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: food-web-ingress}
spec:
  podSelector: {matchLabels: {app: web-ui}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 130.211.0.0/22}
        - ipBlock: {cidr: 35.191.0.0/16}
      ports: [{port: 3000}]
{{- end }}
