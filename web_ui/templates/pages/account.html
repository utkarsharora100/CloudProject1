<div class="page-heading"><span class="eyebrow">A PLACE FOR THE DETAILS</span><h1>Your little corner.</h1><p>Keep your demo profile and delivery addresses in order.</p></div><div class="account-layout"><section class="panel"><span class="eyebrow">THE PERSON AT THE TABLE</span><h2>Your profile</h2><form id="profile-form" class="form-stack"><label>Name<input name="name" required maxlength="100" autocomplete="off" placeholder="Demo diner"></label><label>Email<input name="email" type="email" required maxlength="254" autocomplete="off" placeholder="diner@example.test"></label><button class="button primary" type="submit">Save profile ↗</button></form><p class="fineprint">Use fictional details in this local demonstration.</p></section><section><div class="section-heading"><h2>Saved addresses</h2><button class="button" id="new-address">+ Add address</button></div><div id="address-list" class="address-list"></div><form id="address-form" class="panel form-stack" hidden><div class="section-heading"><h3 id="address-form-title">A new doorstep.</h3><button class="icon-button" type="button" id="close-address-form" aria-label="Close address form">×</button></div><input type="hidden" name="address_id"><label>Label<input name="label" required maxlength="40" placeholder="Demo home"></label><label>Address line<input name="line1" required maxlength="200" placeholder="12 Paper Lane (fictional)"></label><div class="form-grid"><label>City<input name="city" required maxlength="80" placeholder="Demo City"></label><label>Postal code<input name="postal_code" required maxlength="20" placeholder="000000"></label></div><label>Country code<input name="country_code" required maxlength="2" value="IN"></label><label class="checkbox-label"><input type="checkbox" name="is_default">Make this the default address</label><button class="button primary" type="submit">Save address ↗</button></form></section></div>
