<div class="page-heading"><a class="back-link" href="/kitchen">← Order board</a><span class="eyebrow">WHAT’S COOKING</span><h1>On the menu.</h1><p>Opening status, preparation estimates, and the things you make best.</p></div><div class="editor-layout"><section><div id="menu-editor-list" class="editor-list"></div><button class="button" id="add-menu-item">+ Add a menu item</button></section><aside><form id="restaurant-form" class="panel form-stack"><span class="eyebrow">KITCHEN SETTINGS</span><h2>Ready for orders?</h2><label class="checkbox-label"><input type="checkbox" name="is_open">Kitchen open</label><label>Kitchen name<input name="name" maxlength="120" required></label><label>Preparation estimate <span class="caption">(minutes)</span><input name="estimated_prep_time_mins" type="number" min="1" max="240" required></label><button class="button primary">Save kitchen settings ↗</button><p class="fineprint">This estimate never marks an order ready automatically.</p></form><form id="item-form" class="panel form-stack" hidden><div class="section-heading"><h2 id="item-form-title">A new favourite.</h2><button type="button" class="icon-button" id="close-item-form" aria-label="Close item editor">×</button></div><label>Item ID<input name="item_id" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" maxlength="64" placeholder="seasonal-bowl"></label><label>Name<input name="name" required maxlength="120"></label><label>Description<textarea name="description" maxlength="500" rows="3"></textarea></label><label>Price <span class="caption">(INR)</span><input name="price" required inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,2})?" placeholder="249.00"></label><label class="checkbox-label"><input name="available" type="checkbox" checked>Available to order</label><button class="button primary">Save menu item ↗</button></form></aside></div>
