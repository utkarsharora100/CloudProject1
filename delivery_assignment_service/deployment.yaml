apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-assignment
  template:
    metadata:
      labels:
        app: delivery-assignment
    spec:
      containers:
      - name: delivery-assignment
        image: us-central1-docker.pkg.dev/cloud-project-512416/food-delivery-repo/delivery-assignment:v1
        ports:
        - containerPort: 8082
        env:
        # Internal DNS name for ZooKeeper in K8s
        - name: ZK_HOSTS
          value: "zookeeper-client:2181"
        # Kafka Credentials
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
        - name: KAFKA_API_KEY
          value: "QPLQBIBRATPDKGSF"
        - name: KAFKA_API_SECRET
          value: "cfltb2aNdzyoDfVjvEXRMcW/pugEYqRNHcqQ/B2R/ziuu4dNZ4xeYGYnnVWHoGNg"
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-assignment-svc
spec:
  selector:
    app: delivery-assignment
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082