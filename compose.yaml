    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; assert json.load(urlopen('http://127.0.0.1:3000/health', timeout=3))['status']=='healthy'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

