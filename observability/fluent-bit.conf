[SERVICE]
    Flush 1
    Log_Level warn
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    Health_Check On
[INPUT]
    Name tail
    Path /var/log/food/*.jsonl
    Parser json
    Tag food
    DB /fluent-bit/state/tail.db
    Read_from_Head On
    Refresh_Interval 1
    Rotate_Wait 15
    Skip_Long_Lines On
    Mem_Buf_Limit 10M
[OUTPUT]
    Name loki
    Match food
    Host loki
    Port 3100
    Labels job=food-delivery,service=$service
    Line_Format json
