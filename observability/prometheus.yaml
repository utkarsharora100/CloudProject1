global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files: ["/etc/prometheus/alerts.yaml"]
scrape_configs:
  - job_name: food-apis
    static_configs:
      - targets: ["customer-service:8083","restaurant-api:8084","order-service:8081","task-api:8085","payment-service:8086","kitchen-api:8087","delivery-service:8082","notification-api:8088","restaurant-analytics-api:8091"]
  - job_name: restaurant-flink
    static_configs:
      - targets: ["flink-jobmanager:9249","flink-taskmanager:9249"]
  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["log-collector:2020"]
