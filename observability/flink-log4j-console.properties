rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = JsonFile
appender.console.name = Console
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %-5p %c{1} - %m%n
appender.file.name = JsonFile
appender.file.type = RollingFile
appender.file.fileName = /var/log/food/flink-${env:HOSTNAME}.jsonl
appender.file.filePattern = /var/log/food/flink-${env:HOSTNAME}-%i.jsonl.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = {"service":"restaurant-analytics","event":"flink_log","level":"%p","message":"%enc{%m}{JSON}"}%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 2
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
